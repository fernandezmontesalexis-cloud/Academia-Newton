{% extends 'web/base/base.html' %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h4 class="mb-0 fw-bold">Nuevo Usuario</h4>
        <small class="text-muted">Crear cuenta de acceso al sistema</small>
    </div>
    <a href="{% url 'lista_usuarios' %}" class="btn btn-outline-secondary btn-sm">
        <i class="fas fa-arrow-left me-1"></i> Volver
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre de usuario</label>
                        <input type="text" name="username" class="form-control"
                               value="{{ username|default:'' }}" required
                               placeholder="Ej: secretaria_huaura" autocomplete="off">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Tipo de usuario</label>
                        <select name="tipo_usuario" class="form-select">
                            <option value="admin" {% if tipo_usuario == "admin" %}selected{% endif %}>
                                Administrador
                            </option>
                            <option value="secretaria" {% if tipo_usuario == "secretaria" or not tipo_usuario %}selected{% endif %}>
                                Secretaria
                            </option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Sede asignada</label>
                        <select name="sede" class="form-select">
                            {% for sede in sedes %}
                            <option value="{{ sede.id }}" {% if sede_id == sede.id|stringformat:"s" %}selected{% endif %}>
                                {{ sede.nombre }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <hr class="my-3">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Contraseña</label>
                        <div class="input-group">
                            <input type="password" name="password" id="passInput"
                                   class="form-control" required
                                   placeholder="Mínimo 6 caracteres"
                                   autocomplete="new-password">
                            <button class="btn btn-outline-secondary" type="button"
                                    onclick="togglePass('passInput', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Confirmar contraseña</label>
                        <div class="input-group">
                            <input type="password" name="confirmar_password" id="confirmarInput"
                                   class="form-control" required
                                   placeholder="Repetir contraseña"
                                   autocomplete="new-password">
                            <button class="btn btn-outline-secondary" type="button"
                                    onclick="togglePass('confirmarInput', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="d-flex gap-2 justify-content-end">
                        <a href="{% url 'lista_usuarios' %}" class="btn btn-outline-secondary">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-1"></i> Crear usuario
                        </button>
                    </div>

                </form>

            </div>
        </div>
    </div>
</div>

<script>
function togglePass(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
    }
}

const confirmarInput = document.getElementById('confirmarInput');
const passInput = document.getElementById('passInput');

document.querySelector('form').addEventListener('submit', function(e) {
    if (passInput.value && passInput.value !== confirmarInput.value) {
        e.preventDefault();
        confirmarInput.setCustomValidity('Las contraseñas no coinciden');
        confirmarInput.reportValidity();
    } else {
        confirmarInput.setCustomValidity('');
    }
});

confirmarInput.addEventListener('input', function() {
    this.setCustomValidity('');
});
</script>

{% endblock %}
