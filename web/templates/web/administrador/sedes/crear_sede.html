{% extends 'web/base/base.html' %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h4 class="mb-0 fw-bold">Nueva Sede</h4>
        <small class="text-muted">Registrar una nueva sede en el sistema</small>
    </div>
    <a href="{% url 'lista_sedes' %}" class="btn btn-outline-secondary btn-sm">
        <i class="fas fa-arrow-left me-1"></i> Volver
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">

                <!-- Icono + subtítulo -->
                <div class="text-center mb-4">
                    <span class="d-inline-flex align-items-center justify-content-center rounded-circle bg-primary-subtle text-primary mb-2"
                          style="width:56px;height:56px;font-size:22px;">
                        <i class="fas fa-building"></i>
                    </span>
                    <div class="text-muted small">La sede quedará activa automáticamente al crearla.</div>
                </div>

                {% if messages %}
                {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endfor %}
                {% endif %}

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre de la sede</label>
                        <input type="text" name="nombre" class="form-control" required
                               placeholder="Ej: Sede Huacho">
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Dirección</label>
                        <input type="text" name="direccion" class="form-control"
                               value="{{ direccion|default:'' }}"
                               placeholder="Ej: Jr. Lima 123, Huacho">
                    </div>

                    <div class="d-flex gap-2 justify-content-end">
                        <a href="{% url 'lista_sedes' %}" class="btn btn-outline-secondary">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-1"></i> Guardar
                        </button>
                    </div>

                </form>

            </div>
        </div>
    </div>
</div>

{% endblock %}
