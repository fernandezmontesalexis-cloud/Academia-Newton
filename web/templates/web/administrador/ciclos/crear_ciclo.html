{% extends 'web/base/base.html' %}

{% block content %}

<div class="container">
    <div class="card" style="max-width: 600px; margin: auto; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);">

        <h2 style="text-align:center; margin-bottom: 20px;">Nuevo Ciclo</h2>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Nombre</label>
                <input type="text" name="nombre" class="form-control">
            </div>

            <div class="form-group">
                <label>Precio</label>
                <input type="number" step="0.01" name="precio" class="form-control">
            </div>

            <div class="form-group">
                <label>Fecha inicio</label>
                <input type="date" name="fecha_inicio" class="form-control">
            </div>

            <div class="form-group">
                <label>Fecha fin</label>
                <input type="date" name="fecha_fin" class="form-control">
            </div>

            <div style="margin-top:20px; display:flex; justify-content: space-between;">
                <button type="submit" class="btn">Guardar</button>
                <a href="{% url 'lista_ciclos' %}" class="btn-cancel">Cancelar</a>
            </div>

        </form>
    </div>
</div>

{% endblock %}
