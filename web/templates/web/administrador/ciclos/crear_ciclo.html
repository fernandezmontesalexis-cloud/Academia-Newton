{% extends 'web/base/base.html' %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h4 class="mb-0 fw-bold">Nuevo Ciclo</h4>
        <small class="text-muted">Crear ciclo para una o todas las sedes</small>
    </div>
    <a href="{% url 'lista_ciclos' %}" class="btn btn-outline-secondary btn-sm">
        <i class="fas fa-arrow-left me-1"></i> Volver
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">

                {% if messages %}
                {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endfor %}
                {% endif %}

                <form method="POST">
                    {% csrf_token %}

                    <!-- Aplicar a -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Aplicar a</label>
                        <div class="d-flex gap-4">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="alcance"
                                       id="todasSedes" value="todas" checked
                                       onchange="toggleSede(this)">
                                <label class="form-check-label" for="todasSedes">
                                    Todas las sedes
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="alcance"
                                       id="sedeEspecifica" value="especifica"
                                       onchange="toggleSede(this)">
                                <label class="form-check-label" for="sedeEspecifica">
                                    Sede específica
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Selector de sede (oculto por defecto) -->
                    <div class="mb-3" id="selectorSede" style="display:none;">
                        <label class="form-label fw-semibold">Sede</label>
                        <select name="sede_id" class="form-select">
                            <option value="">— Seleccionar sede —</option>
                            {% for sede in sedes %}
                            <option value="{{ sede.id }}">{{ sede.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre del ciclo</label>
                        <input type="text" name="nombre" class="form-control" required
                               placeholder="Ej: Verano 2026">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Precio (S/.)</label>
                        <input type="number" step="0.01" min="0" name="precio"
                               class="form-control" required placeholder="0.00">
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-6">
                            <label class="form-label fw-semibold">Fecha inicio</label>
                            <input type="date" name="fecha_inicio" class="form-control" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-semibold">Fecha fin</label>
                            <input type="date" name="fecha_fin" class="form-control" required>
                        </div>
                    </div>

                    <div class="d-flex gap-2 justify-content-end mt-4">
                        <a href="{% url 'lista_ciclos' %}" class="btn btn-outline-secondary">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-1"></i> Guardar
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>

<script>
function toggleSede(radio) {
    document.getElementById('selectorSede').style.display =
        radio.value === 'especifica' ? 'block' : 'none';
}
</script>

{% endblock %}
