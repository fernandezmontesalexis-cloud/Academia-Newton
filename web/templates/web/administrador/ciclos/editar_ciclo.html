{% extends 'web/base/base.html' %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h4 class="mb-0 fw-bold">Editar Ciclo</h4>
        <small class="text-muted">Modificar datos del ciclo</small>
    </div>
    <a href="{% url 'ciclos_sede_detalle' ciclo.sede.id %}" class="btn btn-outline-secondary btn-sm">
        <i class="fas fa-arrow-left me-1"></i> Volver
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre del ciclo</label>
                        <input type="text" name="nombre" class="form-control"
                               value="{{ ciclo.nombre }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Precio (S/.)</label>
                        <input type="number" step="0.01" min="0" name="precio"
                               class="form-control" value="{{ ciclo.precio }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Fecha de inicio</label>
                        <input type="date" name="fecha_inicio" class="form-control"
                               value="{{ ciclo.fecha_inicio|date:'Y-m-d' }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Fecha de fin</label>
                        <input type="date" name="fecha_fin" class="form-control"
                               value="{{ ciclo.fecha_fin|date:'Y-m-d' }}" required>
                    </div>

                    <div class="d-flex gap-2 justify-content-end mt-4">
                        <a href="{% url 'ciclos_sede_detalle' ciclo.sede.id %}" class="btn btn-outline-secondary">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-1"></i> Actualizar
                        </button>
                    </div>

                </form>

            </div>
        </div>
    </div>
</div>

{% endblock %}
