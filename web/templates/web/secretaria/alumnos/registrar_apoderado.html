{% extends 'web/base/base.html' %}
{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'web/css/registro_alumno.css' %}">
{% endblock %}
{% block content %}
<div class="alumno-container">

    <h1>Registro Académico</h1>
    <p class="subtitle">Paso 2: Datos del apoderado</p>
    <form method="POST">
        {% csrf_token %}

        <!-- DATOS APODERADO -->
        <div class="form-grid">

            <div class="form-group">
                <label>Nombre Completo *</label>
                <input type="text" name="nombre_apoderado" value="{{ apoderado.nombre_apoderado }}" required>
            </div>

            <div class="form-group">
                <label>DNI *</label>

                <input type="text" name="dni_apoderado" value="{{ apoderado.dni_apoderado }}" maxlength="8"
                    inputmode="numeric" pattern="[0-9]{8}" oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                    placeholder="Ingrese DNI" required>
            </div>

            <div class="form-group">
                <label>Celular *</label>

                <input type="text" name="celular_apoderado" value="{{ apoderado.celular_apoderado }}" maxlength="9"
                    inputmode="numeric" pattern="[0-9]{9}" oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                    placeholder="Ingrese celular" required>
            </div>

            <div class="form-group">
                <label>Dirección</label>

                <input type="text" name="direccion_apoderado" value="{{ apoderado.direccion_apoderado }}">
            </div>

        </div>
        <div class="botones-form">

            <a href="{% url 'registrar_alumno' %}" class="btn btn-outline-dark">
                ← Atrás
            </a>

            <button type="submit" class="btn btn-outline-primary">
                Siguiente →
            </button>

            <a href="{% url 'cancelar_registro' %}" class="btn btn-outline-secondary"
                onclick="confirmarCancelacion(event, this.href)">
                Cancelar
            </a>

        </div>
</div>



</form>

</div>

{% endblock %}
