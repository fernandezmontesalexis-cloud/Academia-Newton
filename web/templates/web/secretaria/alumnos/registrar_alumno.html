{% extends 'web/base/base.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'web/css/registro_alumno.css' %}">
<div class="alumno-container">

    <h1>Registro Académico</h1>
    <p class="subtitle">Paso 1: Datos del Alumno</p>
    <form method="POST">
        {% csrf_token %}

        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-danger">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}

        <!-- DATOS DEL ALUMNO -->
        <div class="form-section">
            <div class="form-grid">

                <div class="form-group">
                    <label>Apellido Paterno *</label>
                    <input type="text" name="apellido_paterno" required value="{{ alumno.apellido_paterno }}">
                </div>

                <div class="form-group">
                    <label>Apellido Materno *</label>
                    <input type="text" name="apellido_materno" required value="{{ alumno.apellido_materno }}">

                </div>

                <div class="form-group">
                    <label>Nombres *</label>
                    <input type="text" name="nombres" required value="{{ alumno.nombres }}">
                </div>

                <div class="form-group">
                    <label>DNI *</label>
                    <input type="text" name="dni" value="{{ alumno.dni }}" pattern="[0-9]{8}" required maxlength="8">
                </div>

                <div class="form-group">
                    <label>Celular</label>
                    <input type="text" name="celular" value="{{ alumno.celular }}">
                </div>


                <div class="form-group">
                    <label>Fecha de Nacimiento</label>
                    <input type="date" name="fecha_nacimiento" value="{{ alumno.fecha_nacimiento }}"">
                </div>

                <div class=" form-group">
                    <label>Dirección</label>
                    <input type="text" name="direccion" value="{{ alumno.direccion }}">
                </div>
                <div class="form-group">
                    <label>Departamento *</label>

                    <select id="departamento" name="departamento" class="form-control">

                        <option value="">Seleccione</option>

                        {% for d in departamentos %}
                        <option value="{{ d.id }}" {% if d.id == departamento_seleccionado %}selected{% endif %}>
                            {{ d.nombre }}
                        </option>
                        {% endfor %}

                    </select>
                </div>

                <div class="form-group">
                    <label>Provincia *</label>

                    <select id="provincia" name="provincia" class="form-control">
                        <option value="">Seleccione un departamento</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Distrito *</label>

                    <select id="distrito" name="distrito" class="form-control">
                        <option value="">Seleccione una provincia</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" name="email" value="{{ alumno.email }}" placeholder="correo@ejemplo.com">
                </div>

            </div>
        </div>

        <div class="d-flex gap-2 justify-content-end mt-4">

            <button type="submit" class="btn btn-outline-primary">
                Siguiente →
            </button>

            <a href="{% url 'cancelar_registro' %}" class="btn btn-outline-secondary"
                onclick="confirmarCancelacion(event, this.href)">
                Cancelar
            </a>

        </div>

    </form>
    <script>

        document.addEventListener("DOMContentLoaded", async function () {

            const departamento = document.getElementById("departamento");
            const provincia = document.getElementById("provincia");
            const distrito = document.getElementById("distrito");

            const provinciaSeleccionada = "{{ alumno.provincia }}";
            const distritoSeleccionado = "{{ alumno.distrito }}";

            // =========================
            // CARGAR PROVINCIAS
            // =========================
            async function cargarProvincias(departamentoId, selectedProvincia = null) {

                provincia.innerHTML =
                    '<option value="">Seleccione una provincia</option>';

                distrito.innerHTML =
                    '<option value="">Seleccione un distrito</option>';

                if (!departamentoId) return;

                const response =
                    await fetch(`/get-provincias/${departamentoId}/`);

                const data = await response.json();

                data.forEach(p => {

                    provincia.innerHTML += `
                <option value="${p.id}"
                ${selectedProvincia == p.id ? "selected" : ""}
                >
                    ${p.nombre}
                </option>
            `;
                });

                // cargar distritos automáticamente
                if (selectedProvincia) {
                    cargarDistritos(selectedProvincia, distritoSeleccionado);
                }
            }

            // =========================
            // CARGAR DISTRITOS
            // =========================
            async function cargarDistritos(provinciaId, selectedDistrito = null) {

                distrito.innerHTML =
                    '<option value="">Seleccione un distrito</option>';

                if (!provinciaId) return;

                const response =
                    await fetch(`/get-distritos/${provinciaId}/`);

                const data = await response.json();

                data.forEach(d => {

                    distrito.innerHTML += `
                <option value="${d.id}"
                ${selectedDistrito == d.id ? "selected" : ""}
                >
                    ${d.nombre}
                </option>
            `;
                });
            }

            // =========================
            // EVENTOS
            // =========================
            departamento.addEventListener("change", function () {

                cargarProvincias(this.value);
            });

            provincia.addEventListener("change", function () {

                cargarDistritos(this.value);
            });

            // =========================
            // RECUPERAR DATOS
            // =========================
            if (departamento.value) {

                cargarProvincias(
                    departamento.value,
                    provinciaSeleccionada
                );
            }

        });

    </script>

</div>

{% endblock %}
