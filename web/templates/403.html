<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 — Acceso denegado | Academia Newton</title>
    <link href="https://fonts.googleapis.com/css2?family=Concert+One&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #FF7F2E;
            font-family: 'Concert One', cursive;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* ── Gran "403" de fondo ── */
        .text {
            position: absolute;
            left: 50%;
            top: 40%;
            transform: translate(-50%, -50%);
            color: rgba(19, 36, 44, 0.1);
            font-size: 30em;
            text-align: center;
            user-select: none;
            pointer-events: none;
            line-height: 1;
        }

        /* ── Contenedor de los personajes ── */
        .container {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            height: 300px;
            width: 500px;
        }
        .container::after {
            position: absolute;
            content: "";
            background-color: rgba(19, 36, 44, 0.1);
            border-radius: 12px;
            bottom: 40px;
            height: 12px;
            left: 80px;
            width: 350px;
            z-index: -1;
        }

        /* ── Personaje ── */
        .caveman {
            height: 300px;
            position: absolute;
            width: 250px;
        }
        .caveman:nth-child(1) { right: 20px; }
        .caveman:nth-child(2) { left: 20px; transform: rotateY(180deg); }

        /* Cabeza */
        .head {
            position: absolute;
            background-color: #13242C;
            border-radius: 50px;
            height: 140px;
            left: 60px;
            top: 25px;
            width: 65px;
        }
        .head::after, .head::before {
            content: "";
            position: absolute;
            background-color: #13242C;
            border-radius: 10px;
            height: 20px;
            width: 7px;
        }
        .head::after  { left: 35px; top: -8px; transform: rotate(20deg); }
        .head::before { left: 30px; top: -8px; transform: rotate(-20deg); }

        /* Ojo */
        .head .eye {
            position: absolute;
            left: 45%;
            transform: translateX(-50%);
            background-color: #EAB08C;
            border-radius: 50px;
            height: 16px;
            top: 40px;
            width: 48px;
        }
        .head .eye::after, .head .eye::before {
            content: "";
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: #13242C;
            border-radius: 50%;
            height: 5px;
            width: 5px;
        }
        .head .eye::after  { left: 5px; }
        .head .eye::before { right: 9px; }

        /* Nariz */
        .head .eye .nose {
            position: absolute;
            left: 45%;
            top: 12px;
            background-color: #D9766C;
            border-left: 8px solid rgba(19, 36, 44, 0.1);
            border-radius: 10px;
            box-sizing: border-box;
            height: 35px;
            width: 15px;
        }

        /* Cuerpo */
        .shape {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 50%;
            height: 140px;
            overflow: hidden;
            top: 70px;
            width: 140px;
        }
        .shape .circle {
            position: absolute;
            border-radius: 50%;
            height: 60px;
            width: 60px;
        }
        .shape .circle::after, .shape .circle::before {
            content: "";
            position: absolute;
            border-radius: 50%;
            height: 20px;
            width: 20px;
        }
        .shape .circle::after  { left: 50px; top: 10px; }
        .shape .circle::before { left: 60px; top: 45px; }
        .shape .circle:nth-child(1) { left: -12px; top: 80px; }
        .shape .circle:nth-child(2) { right: 10px; top: 0; transform: rotate(90deg); }
        .shape .circle:nth-child(2)::after  { left: 65px; top: 10px; }
        .shape .circle:nth-child(2)::before { display: none; }

        /* Personaje 1 — rojo */
        .caveman:nth-child(1) .shape                              { background-color: #D13433; }
        .caveman:nth-child(1) .shape .circle                      { background-color: #932422; }
        .caveman:nth-child(1) .shape .circle::after,
        .caveman:nth-child(1) .shape .circle::before              { background-color: #932422; }

        /* Personaje 2 — rojo oscuro */
        .caveman:nth-child(2) .shape                              { background-color: #932422; }
        .caveman:nth-child(2) .shape .circle                      { background-color: #D13433; }
        .caveman:nth-child(2) .shape .circle::after,
        .caveman:nth-child(2) .shape .circle::before              { background-color: #D13433; }

        /* Brazo + garrote */
        .arm-right {
            position: absolute;
            background-color: #EAB08C;
            border-left: 8px solid rgba(19, 36, 44, 0.1);
            border-radius: 50px;
            box-sizing: border-box;
            height: 180px;
            left: 135px;
            top: 80px;
            transform-origin: 30px 30px;
            width: 60px;
            z-index: 1;
        }
        .arm-right .club {
            position: absolute;
            border-bottom: 110px solid #601513;
            border-left:   10px solid transparent;
            border-right:  10px solid transparent;
            height: 0;
            left: -60px;
            top: 120px;
            transform: rotate(70deg);
            width: 20px;
        }
        .arm-right .club::after,
        .arm-right .club::before {
            position: absolute;
            content: "";
            background-color: #601513;
            border-radius: 50%;
            left: 0;
        }
        .arm-right .club::after  { height: 20px; width: 20px; top: -10px; }
        .arm-right .club::before { height: 40px; width: 40px; left: -10px; top: 90px; }

        /* Piernas */
        .leg {
            position: absolute;
            border-radius: 10px;
            height: 55px;
            top: 200px;
            width: 10px;
        }
        .leg::after {
            position: absolute;
            content: "";
            border-radius: 50%;
            height: 10px;
            left: -5px;
            top: 15px;
            width: 10px;
        }
        .leg .foot {
            position: absolute;
            border-radius: 25px 25px 0 0;
            height: 25px;
            left: -38px;
            top: 30px;
            width: 50px;
        }
        .leg .foot::after,
        .leg .foot::before,
        .leg .foot .fingers,
        .leg .foot .fingers::after {
            position: absolute;
            background-color: #EAB08C;
            border-radius: 50%;
            bottom: 0;
            height: 15px;
            transform-origin: bottom;
            width: 15px;
        }
        .leg .foot::after          { left: -6px;  content: ""; }
        .leg .foot::before         { left: 8px;   transform: scale(0.6); content: ""; }
        .leg .foot .fingers        { left: 15px;  transform: scale(0.6); }
        .leg .foot .fingers::after { left: 11px;  content: ""; }

        /* Pierna trasera */
        .leg:nth-child(1)               { background-color: #B2524D; left: 95px; }
        .leg:nth-child(1)::after        { background-color: #B2524D; }
        .leg:nth-child(1) .foot         { background-color: #B2524D; }
        .leg:nth-child(1) .foot::after  { background-color: #B2524D; }
        .leg:nth-child(1) .foot::before { display: none; }

        /* Pierna delantera */
        .leg:nth-child(2)        { background-color: #D9766C; left: 115px; }
        .leg:nth-child(2)::after { background-color: #D9766C; }
        .leg:nth-child(2) .foot  { background-color: #D9766C; }

        /* ── Animaciones ── */
        .caveman:nth-child(1) .arm-right {
            animation: arm-anima 1.2s infinite cubic-bezier(.55,.01,.16,1.34);
        }
        .caveman:nth-child(2) .arm-right {
            animation: arm-anima 1.2s infinite cubic-bezier(.55,.01,.16,1.34);
            animation-delay: 0.6s;
        }
        @keyframes arm-anima {
            0%   { transform: rotate(0); }
            100% { transform: rotate(-360deg); }
        }

        .caveman:nth-child(2) .head {
            animation: head-anima 1.2s infinite cubic-bezier(.55,.01,.16,1.34);
        }
        .caveman:nth-child(1) .head {
            animation: head-anima 1.2s infinite cubic-bezier(.55,.01,.16,1.34);
            animation-delay: 0.6s;
        }
        @keyframes head-anima {
            0%   { top: 25px; }
            42%  { top: 25px; }
            45%  { top: 50px; }
            100% { top: 25px; }
        }

        .caveman:nth-child(2) .eye::after,
        .caveman:nth-child(2) .eye::before {
            animation: eye-anima 1.2s infinite cubic-bezier(.55,.01,.16,1.34);
        }
        .caveman:nth-child(1) .eye::after,
        .caveman:nth-child(1) .eye::before {
            animation: eye-anima 1.2s infinite cubic-bezier(.55,.01,.16,1.34);
            animation-delay: 0.6s;
        }
        @keyframes eye-anima {
            0%   { height: 5px; }
            42%  { height: 5px; }
            45%  { height: 1px; }
            100% { height: 5px; }
        }

        .container::after {
            animation: shadow-anima 1.2s infinite cubic-bezier(.55,.01,.16,1.34);
            animation-delay: 0.1s;
        }
        @keyframes shadow-anima {
            0%   { width: 350px; left: 80px; }
            25%  { width: 450px; left: 80px; }
            50%  { width: 350px; left: 80px; }
            75%  { width: 450px; left: 0; }
            100% { width: 350px; left: 80px; }
        }

        /* ── Mensaje ── */
        .message {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: calc(50% + 168px);
            text-align: center;
            white-space: nowrap;
        }
        .message h2 {
            font-family: 'Concert One', cursive;
            font-size: 1.45rem;
            color: #fff;
            text-shadow: 0 1px 5px rgba(0,0,0,0.18);
            margin-bottom: 6px;
        }
        .message p {
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.88rem;
            color: rgba(255,255,255,0.88);
            margin-bottom: 20px;
            font-weight: 400;
        }
        .message .btn-home {
            display: inline-block;
            background-color: #13242C;
            color: #fff;
            text-decoration: none;
            padding: 11px 32px;
            border-radius: 50px;
            font-family: 'Concert One', cursive;
            font-size: 0.9rem;
            letter-spacing: 0.04em;
            box-shadow: 0 3px 12px rgba(0,0,0,0.25);
            transition: background 0.2s, transform 0.15s;
        }
        .message .btn-home:hover {
            background-color: #1e3a47;
            transform: translateY(-2px);
        }

        /* ── Logo Academia Newton (discreto) ── */
        .brand {
            position: absolute;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Concert One', cursive;
            font-size: 1rem;
            color: rgba(19, 36, 44, 0.35);
            letter-spacing: 0.06em;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <span class="brand">Academia Newton</span>

    <div class="text">403</div>

    <div class="container">
        <!-- Personaje izquierdo -->
        <div class="caveman">
            <div class="leg">
                <div class="foot"><div class="fingers"></div></div>
            </div>
            <div class="leg">
                <div class="foot"><div class="fingers"></div></div>
            </div>
            <div class="shape">
                <div class="circle"></div>
                <div class="circle"></div>
            </div>
            <div class="head">
                <div class="eye"><div class="nose"></div></div>
                <div class="mouth"></div>
            </div>
            <div class="arm-right"><div class="club"></div></div>
        </div>
        <!-- Personaje derecho -->
        <div class="caveman">
            <div class="leg">
                <div class="foot"><div class="fingers"></div></div>
            </div>
            <div class="leg">
                <div class="foot"><div class="fingers"></div></div>
            </div>
            <div class="shape">
                <div class="circle"></div>
                <div class="circle"></div>
            </div>
            <div class="head">
                <div class="eye"><div class="nose"></div></div>
                <div class="mouth"></div>
            </div>
            <div class="arm-right"><div class="club"></div></div>
        </div>
    </div>

    <!-- Mensaje en español -->
    <div class="message">
        <h2>¡Acceso denegado!</h2>
        <p>No tienes permiso para ver esta página.</p>
        <a href="/dashboard/" class="btn-home">Volver al inicio</a>
    </div>

</body>
</html>
